<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>AI Support Chatbot</title>
  <style>
    body { font-family: Arial; background:#f2f2f7; padding:40px; }
    .card { background:#fff; max-width:600px; margin:0 auto; padding:30px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.1); }
    input, textarea { width:100%; padding:10px; margin-top:10px; border-radius:6px; border:1px solid #ccc; }
    button { margin-top:10px; padding:10px 16px; border:none; border-radius:6px; cursor:pointer; background:#6366f1; color:white; }
    #reply { margin-top:20px; padding:12px; background:#eef2ff; border-radius:8px; white-space:pre-wrap; }
    a { color:#6366f1; }
  </style>
</head>
<body>

<div class="card">
  <h1>🤖 Dein AI Support Chatbot</h1>
  <p>Gib deine E-Mail ein und stelle eine Frage.</p>

  <input id="email" placeholder="Deine E-Mail">
  <textarea id="message" rows="3" placeholder="Deine Frage..."></textarea>
  <button id="send">Frage senden</button>

  <div id="reply"></div>

  <p style="margin-top:20px;">
    💳 <a href="/upgrade.html">Upgrade auf Premium / Business</a><br>
    📊 <a href="/dashboard.html">Zu deinem Kunden-Dashboard</a>
  </p>
</div>

<script>
document.getElementById("send").onclick = () => {
  const email = document.getElementById("email").value;
  const message = document.getElementById("message").value;

  fetch("/api/chat", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ email, message })
  })
  .then(r => r.json())
  .then(d => {
    let txt = `Plan: ${d.plan}\n\nAntwort:\n${d.reply}`;
    if (d.upgrade_url) {
      txt += `\n\n→ Upgrade hier: ${d.upgrade_url}`;
    }
    document.getElementById("reply").innerText = txt;
  });
};
</script>

</body>
</html>
