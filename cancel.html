<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Zahlung abgebrochen</title>
    <style>
        body {
            background: #f8d7da;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center;
            width: 480px;
        }
        h1 {
            font-size: 28px;
            color: #b91c1c;
        }
        p {
            font-size: 17px;
            color: #444;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #6366f1;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>❌ Zahlung abgebrochen</h1>
        <p>Dein Kauf wurde nicht abgeschlossen.</p>
        <a href="/upgrade.html">Zurück zur Paket-Auswahl</a>
    </div>

</body>
</html>
