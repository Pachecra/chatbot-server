<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f1f1f1;
        }
        .chatbox {
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .user {
            text-align: right;
            margin: 8px 0;
            color: black;
            background: #d1ffd1;
            padding: 8px;
            border-radius: 10px;
            display: inline-block;
        }
        .bot {
            text-align: left;
            margin: 8px 0;
            color: black;
            background: #e2e2e2;
            padding: 8px;
            border-radius: 10px;
            display: inline-block;
        }
        input {
            padding: 10px;
            width: 80%;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 15px;
            border: none;
            background: black;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Support Chatbot</h2>

    <div class="chatbox">
        <div id="messages"></div>

        <div>
            <input id="input" placeholder="Nachricht eingeben...">
            <button onclick="sendMessage()">Senden</button>
        </div>
    </div>

   <script src="chat-widget.js"></script>


</body>
</html>
